<!--
  MeaVox launcher icon (#32), master for the store icon: a microphone and a music note,
  "singing over a song", in black, gold and grey.
  Microphone: "Microphone Radio" from SVG Repo, https://www.svgrepo.com/svg/260100/microphone-radio (CC0), recolored.

  The app draws the same shapes as vector drawables (app/src/main/res/drawable/ic_launcher_*.xml);
  change them together. The 108 x 108 canvas is the adaptive-icon canvas; launchers show the middle
  72 x 72, and everything important stays inside the 66 dp safe zone (radius 33 around the centre).

  Store icon (fastlane/metadata/android/en-US/images/icon.png): the middle 72 x 72 (viewBox
  "18 18 72 72") rendered at 512 x 512 px, with corners rounded at 22 % of the width and
  transparent outside.
-->
